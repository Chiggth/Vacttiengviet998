<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1c1624" />
    <meta name="description" content="Lộ trình ôn thi V-ACT Tiếng Việt: học lý thuyết, ôn tập chủ động và luyện đọc hiểu." />
    <title>V-ACT Tiếng Việt — Học tập</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="lessons.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Bỏ qua điều hướng</a>
    <aside class="sidebar" id="sidebar" aria-label="Điều hướng học tập">
      <a class="brand" href="#home" aria-label="V-ACT Tiếng Việt, trang chủ">
        <span class="brand-mark" aria-hidden="true">✳</span><span>v-act<span class="brand-light">/việt</span></span>
      </a>
      <div class="sidebar-section-label">KHÔNG GIAN HỌC</div>
      <nav class="primary-nav" aria-label="Chính">
        <button class="nav-item active" data-route="home"><span class="nav-icon">⌂</span>Tổng quan</button>
        <button class="nav-item" data-route="review"><span class="nav-icon">↻</span>Ôn tập <span class="nav-count" id="review-count">03</span></button>
        <button class="nav-item" data-route="practice"><span class="nav-icon">▤</span>Luyện tập</button>
        <button class="nav-item" data-route="assistant"><span class="nav-icon">✳</span>Hỏi trợ lý AI</button>
      </nav>
      <div class="sidebar-section-label chapter-label">LỘ TRÌNH CỦA BẠN <button id="collapse-chapters" class="icon-button small" aria-label="Thu gọn danh sách bài học" title="Thu gọn">−</button></div>
      <nav class="chapter-nav" id="chapter-nav" aria-label="8 phần lý thuyết"></nav>
      <div class="sidebar-bottom">
        <div class="streak-card"><span class="streak-symbol">✦</span><div><strong id="streak-number">0 ngày</strong><span>chuỗi học tập</span></div><span class="streak-dots" aria-hidden="true">● ● ●</span></div>
        <button class="profile-button"><span class="avatar">A</span><span class="profile-copy"><strong>Người học</strong><small>Gói ôn thi V-ACT</small></span><span class="profile-more">···</span></button>
      </div>
    </aside>
    <div class="mobile-shade" id="mobile-shade"></div>
    <main class="main-shell" id="main-content">
      <header class="topbar">
        <button id="menu-toggle" class="icon-button menu-toggle" aria-label="Mở điều hướng" aria-expanded="false">☰</button>
        <div class="breadcrumb"><span>Không gian học</span><span class="breadcrumb-sep">/</span><strong id="breadcrumb-current">Tổng quan</strong></div>
        <div class="topbar-actions"><span class="today-label" id="today-label"></span><button class="icon-button notification" aria-label="Thông báo">♧<i></i></button><span class="top-avatar">A</span></div>
      </header>
      <div class="workspace" id="workspace"></div>
      <footer class="page-footer"><span>V-ACT Tiếng Việt</span><span>Học theo nhịp của bạn <span class="footer-star">✳</span></span></footer>
    </main>
    <dialog id="feedback-dialog" aria-labelledby="dialog-title">
      <form method="dialog" class="dialog-card"><button class="dialog-close" aria-label="Đóng">×</button><span class="dialog-icon">✳</span><h2 id="dialog-title">Rất tốt!</h2><p id="dialog-copy"></p><button class="button primary" value="close">Tiếp tục học <span aria-hidden="true">→</span></button></form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
